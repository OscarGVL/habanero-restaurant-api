services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/habanero
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/habanero
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habanero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: